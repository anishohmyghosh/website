# Post editor (Sveltia CMS). Opened from the "Admin" link on the About page.
# Saving a post commits it to GitHub, which rebuilds the site in ~1 minute.
backend:
  name: github
  repo: anishohmyghosh/website
  branch: main
  commit_messages:
    create: 'Post: {{title}}'
    update: 'Edit post: {{title}}'
    delete: 'Delete post: {{slug}}'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Delete {{path}}'

site_url: https://anishohmyghosh.github.io/website
logo_url: /website/favicon.svg

# Site-wide uploads (anything not attached to a post).
media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    path: '{{slug}}/index'
    # Images live next to the post's index.md, like every existing post.
    media_folder: ''
    public_folder: ''
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{title}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: [date, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    preview_path: 'post/{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
      - name: description
        label: Short description
        widget: text
        required: false
        hint: Shown on post cards and in link previews. One or two sentences.
      - name: tags
        label: Tags
        widget: list
        default: []
        hint: 'Comma-separated. Existing tags: Music, Research, Design, Art. A new tag gets its own page automatically. Match capitalization.'
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: Used in the post header, the post cards, and link previews.
      - { name: body, label: Post, widget: markdown }
      - name: featured
        label: Pin to homepage
        widget: boolean
        default: false
        required: false
      - name: draft
        label: Draft (hidden from the site)
        widget: boolean
        default: false
        required: false
