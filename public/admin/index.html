<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Post Editor</title>
    <script>
      // Unlocked by the password prompt on the About page. Real access control is the GitHub sign-in.
      try { if (sessionStorage.getItem('admin-ok') !== '1') location.replace('/website/about#contact'); } catch (e) {}
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.239.1/dist/sveltia-cms.js"></script>
    <script>
      // Blocks available from the "+" menu in the post editor.
      CMS.registerEditorComponent({
        id: 'button',
        label: 'Button',
        fields: [
          { name: 'label', label: 'Button text', widget: 'string' },
          { name: 'href', label: 'Link (https://… or /post/other-post)', widget: 'string' },
        ],
        pattern: /^<a class="button" href="([^"]*)">(.*?)<\/a>$/m,
        fromBlock: (m) => ({ href: m[1], label: m[2] }),
        toBlock: (d) => `<a class="button" href="${d.href || ''}">${d.label || ''}</a>`,
        toPreview: (d) => `<a class="button" href="${d.href || ''}">${d.label || ''}</a>`,
      });

      CMS.registerEditorComponent({
        id: 'pdf',
        label: 'PDF card',
        fields: [
          { name: 'file', label: 'PDF', widget: 'file', media_folder: '/public/files', public_folder: '/files' },
          { name: 'title', label: 'Title', widget: 'string', required: false },
        ],
        pattern: /^\[(.*?)\]\((\/files\/[^)\s]+\.pdf)\)$/m,
        fromBlock: (m) => ({ title: m[1], file: m[2] }),
        toBlock: (d) => `[${d.title || (d.file || '').split('/').pop()}](${d.file || ''})`,
        toPreview: (d) => `<p>📄 ${d.title || d.file || 'PDF'}</p>`,
      });

      CMS.registerEditorComponent({
        id: 'embed',
        label: 'Embed (YouTube, Spotify, SoundCloud, Vimeo, Apple Music)',
        fields: [{ name: 'url', label: 'Link', widget: 'string' }],
        pattern: /^(https?:\/\/(?:www\.|m\.)?(?:youtube\.com|youtu\.be|vimeo\.com|soundcloud\.com|open\.spotify\.com|music\.apple\.com)\/\S*)$/m,
        fromBlock: (m) => ({ url: m[1] }),
        toBlock: (d) => d.url || '',
        toPreview: (d) => `<p>▶ ${d.url || ''}</p>`,
      });
    </script>
  </body>
</html>
